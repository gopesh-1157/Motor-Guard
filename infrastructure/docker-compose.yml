# ==============================================================================
# MotorGuard — Local Gateway Docker Compose Infrastructure
# Phase 0: Establishes supporting broker and database containers.
# Application services (backend, frontend, simulator) are documented and
# commented out until their respective implementation phases.
# ==============================================================================

networks:
  motorguard-net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. Eclipse Mosquitto MQTT Message Broker
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: motorguard-mosquitto
    restart: unless-stopped
    ports:
      # Bound to localhost interface for local development security (MG-F02)
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - motorguard-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. MongoDB Document Database
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: motorguard-mongodb
    restart: unless-stopped
    ports:
      # Bound to localhost interface for local development security
      - "127.0.0.1:27018:27017"
    environment:
      MONGO_INITDB_DATABASE: motorguard_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - motorguard-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. FastAPI Backend API & Ingestion Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: motorguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB_NAME=motorguard_db
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - motorguard-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

