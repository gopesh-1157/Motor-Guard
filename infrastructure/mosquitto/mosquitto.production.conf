# ==============================================================================
# MotorGuard — Production Mosquitto Configuration (MQTTS TLS Port 8883)
# ==============================================================================

# Disallow unauthenticated anonymous clients
allow_anonymous false

# Password and Topic-Level Access Control List
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl.conf

# ------------------------------------------------------------------------------
# Secure MQTTS Listener (Port 8883) with TLS 1.2+
# ------------------------------------------------------------------------------
listener 8883 0.0.0.0
tls_version tlsv1.2
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Optional: Secure WebSocket Listener for browser SCADA clients (Port 8083)
listener 8083 0.0.0.0
protocol websockets
tls_version tlsv1.2
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Persistence & Storage
persistence true
persistence_location /mosquitto/data/

# Logging & Monitoring
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Industrial Connection Limits
max_connections 1000
max_queued_messages 5000
message_size_limit 65536
