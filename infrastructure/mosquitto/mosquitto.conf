# ==============================================================================
# MotorGuard — Local Development Mosquitto Configuration
# ==============================================================================

# Standard unencrypted MQTT listener on local network port
listener 1883 0.0.0.0

# Development mode: allow anonymous connections (Production will require password_file)
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 100
max_queued_messages 1000
message_size_limit 65536
