# ==============================================================================
# MotorGuard — Production MQTT Topic-Level Access Control List (ACL)
# Principle of Least Privilege:
# 1. Hardware devices can only publish to their OWN designated topic namespace.
# 2. Simulator cannot spoof real physical hardware topics.
# 3. Backend gateway has read-only ingestion access across valid telemetry topics.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FastAPI Backend Subscriber Gateway (Read-Only Telemetry Ingestion)
# ------------------------------------------------------------------------------
user motorguard_gateway
topic read motorguard/v1/+/telemetry
topic read motorguard/v1/+/status
topic read motorguard/v1/+/heartbeat
topic read motorguard/+/telemetry
topic read motorguard/+/status

# ------------------------------------------------------------------------------
# 2. Physical ESP32 Node 001 (Isolated Hardware Telemetry Publisher)
# Authorized ONLY to write to motorguard/v1/ESP32-NODE-001/#
# ------------------------------------------------------------------------------
user esp32_node_001
topic write motorguard/v1/ESP32-NODE-001/telemetry
topic write motorguard/v1/ESP32-NODE-001/status
topic write motorguard/v1/ESP32-NODE-001/heartbeat
topic read motorguard/v1/ESP32-NODE-001/commands

# ------------------------------------------------------------------------------
# 3. Virtual Fleet Simulator (Virtual Motors Only)
# Restricted strictly to sim-node prefix; cannot spoof physical hardware
# ------------------------------------------------------------------------------
user motorguard_simulator
topic write motorguard/v1/sim-node-001/telemetry
topic write motorguard/v1/sim-node-002/telemetry
topic write motorguard/v1/sim-node-003/telemetry
topic write motorguard/v1/sim-node-+/telemetry
